<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <!-- Verlaufene Tusche auf Papier: weicher, unregelmäßiger Fleck mit dunklerem Rand -->
  <defs>
    <filter id="verlauf" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="70" xChannelSelector="R" yChannelSelector="B" result="d"/>
      <feGaussianBlur in="d" stdDeviation="7"/>
    </filter>
    <radialGradient id="rand" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-opacity=".55"/>
      <stop offset=".75" stop-opacity=".75"/>
      <stop offset="1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="200" cy="120" rx="150" ry="78" fill="url(#rand)" filter="url(#verlauf)"/>
</svg>
