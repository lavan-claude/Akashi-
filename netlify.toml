# Veröffentlicht wird nur der Ordner site/ – Skills, Doku und Funktionsquellen
# landen so nicht öffentlich im Netz.
[build]
  publish = "site"

[functions]
  directory = "netlify/functions"

# Bis zum Livegang nicht in Suchmaschinen auftauchen. Vor dem Umzug auf
# akashi-bremen.de entfernen.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
